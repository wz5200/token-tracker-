<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>合约钱包源头追踪 · Token Tracker</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--txt:#e8edf5;--dim:#8b96ad;--acc:#4da3ff;--ok:#3ddc84;--warn:#ffb020;--bad:#ff5d5d;--mut:#5a6780}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:14px;max-width:760px;margin:0 auto}
h1{font-size:20px;margin:10px 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:14px}
.bar{display:flex;gap:8px;margin-bottom:12px}
input{flex:1;background:var(--card);border:1px solid #2a3550;color:var(--txt);border-radius:10px;padding:12px;font-size:14px;min-width:0}
button{background:var(--acc);border:0;color:#fff;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700}
button:disabled{opacity:.5}
.lang{position:absolute;top:12px;right:14px;background:var(--card);color:var(--txt);border:1px solid #2a3550;border-radius:8px;padding:6px 10px;font-size:13px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.presets button{background:var(--card);border:1px solid #2a3550;color:var(--acc);font-size:13px;padding:8px 12px;font-weight:400}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:700}
.ok{background:#123f2b;color:var(--ok)} .partial{background:#4a3410;color:var(--warn)} .missing{background:#333c52;color:var(--dim)}
.concl{background:#101827;border-left:3px solid var(--acc);padding:10px;border-radius:0 8px 8px 0;font-size:14px;line-height:1.6;margin-top:8px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px dashed #263049}
.kv span:first-child{color:var(--dim)}
.mono{font-family:ui-monospace,monospace;font-size:12px;word-break:break-all}
.addr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #263049;font-size:13px}
.copy{background:#2a3550;border:0;color:var(--txt);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:400}
.score{font-size:44px;font-weight:800;text-align:center;margin:6px 0}
.factor{font-size:13px;color:var(--dim);padding:3px 0}
.loading{text-align:center;color:var(--dim);padding:30px}
.err{background:#3d1a1a;border-radius:10px;padding:12px;margin-bottom:12px;font-size:14px}
.foot{color:var(--dim);font-size:12px;text-align:center;margin:20px 0;line-height:1.8}
.score-hi{color:var(--bad)} .score-mid{color:var(--warn)} .score-lo{color:var(--ok)}
table{width:100%;font-size:13px;border-collapse:collapse}
td,th{padding:6px 4px;border-bottom:1px dashed #263049;text-align:left}
th{color:var(--dim);font-weight:400}
</style>
</head>
<body>
<button class="lang" id="langBtn">EN</button>
<h1 id="t_title">合约钱包源头追踪</h1>
<div class="sub" id="t_sub">输入 BSC 合约地址或 Solana mint，一键全套体检 · 只读不交易</div>
<div class="bar">
  <select id="chain" style="background:var(--card);border:1px solid #2a3550;color:var(--txt);border-radius:10px;padding:12px;font-size:14px">
    <option value="bsc">BSC</option>
    <option value="world">World Chain</option>
    <option value="sol">Solana</option>
  </select>
  <input id="addr" placeholder="0x… 或 mint 地址">
  <button id="go">查</button>
</div>
<div class="presets" id="presets"></div>
<div id="out"></div>
<div class="foot" id="t_foot">数据来自 DexScreener / BSC RPC / BscScan / Solana RPC · 仅供研究，不构成投资建议</div>
<script>
const I = {
zh:{title:"合约钱包源头追踪",sub:"输入 BSC 合约地址或 Solana mint，一键全套体检 · 只读不交易",ph:"0x… 或 mint 地址",go:"查",foot:"数据来自 DexScreener / BSC RPC / BscScan / Solana RPC · 仅供研究，不构成投资建议",loading:"链上查询中，请稍候…",need:"请先输入合约地址",badfmt:"地址格式不对：BSC 以 0x 开头 42 位，Solana 为 base58",fail:"查询失败：",copy:"复制",copied:"已复制",status:{ok:"正常",partial:"部分",missing:"缺数据"},score:"综合风险评分",factors:"扣分项",top:"大户榜",pct:"占比",src:"资金来源",pool:"交易池",cluster:"共同源头（疑似分仓）",moves:"大额异动",sells:"砸盘",buys:"买入",transfer:"大额转账",presets:"快捷"},
en:{title:"Token Tracker",sub:"Paste a BSC contract or Solana mint for a full health check · read-only",ph:"0x… or mint address",go:"Scan",foot:"Data: DexScreener / BSC RPC / BscScan / Solana RPC · research only, not investment advice",loading:"Querying chains, hold on…",need:"Enter a contract address first",badfmt:"Bad format: BSC is 0x + 40 hex chars, Solana is base58",fail:"Failed: ",copy:"Copy",copied:"Copied",status:{ok:"OK",partial:"Partial",missing:"No data"},score:"Risk Score",factors:"Risk factors",top:"Top holders",pct:"share",src:"Fund source",pool:"pool",cluster:"Shared source (possible split wallets)",moves:"Large moves",sells:"dump",buys:"buy",transfer:"large transfer",presets:"Quick"}
};
let lang = localStorage.getItem("tt_lang") || "zh";
const $ = id => document.getElementById(id);
function t(){ return I[lang]; }
function applyLang(){
  const d = t();
  document.documentElement.lang = lang==="zh"?"zh":"en";
  $("t_title").textContent = d.title; $("t_sub").textContent = d.sub;
  $("addr").placeholder = d.ph; $("go").textContent = d.go;
  $("t_foot").textContent = d.foot; $("langBtn").textContent = lang==="zh"?"EN":"中文";
  renderPresets();
}
$("langBtn").onclick = ()=>{ lang = lang==="zh"?"en":"zh"; localStorage.setItem("tt_lang",lang); applyLang(); };
const PRESETS = [
  {n:"MJ (BSC)", a:"0xbd824d3f83c31ab38132bfc76654897c73157777", c:"bsc"},
  {n:"WLD (World Chain)", a:"0x2cFc85d8E48F8EAB294be644d9E25C3030863003", c:"world"},
];
function renderPresets(){
  const d=t(); const el=$("presets"); el.innerHTML = `<span style="color:var(--dim);font-size:13px">${d.presets}:</span>`;
  PRESETS.forEach(p=>{ const b=document.createElement("button"); b.textContent=p.n;
    b.onclick=()=>{ $("addr").value=p.a; $("chain").value=p.c; scan(); }; el.appendChild(b); });
}
function badge(s){ const d=t(); return `<span class="badge ${s}">${d.status[s]||s}</span>`; }
function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function short(a){ return a ? a.slice(0,10)+"…"+a.slice(-6) : "—"; }
function addrRow(a){
  return `<div class="addr"><span class="mono">${short(a)}</span><button class="copy" onclick="navigator.clipboard.writeText('${a}').then(()=>this.textContent='${t().copied}')">${t().copy}</button></div>`;
}
function conc(m){
  return m["conclusion_"+lang] || m.conclusion_zh;
}
function renderModule(m){
  const d=t(); let body="";
  const k=m.key, v=m.data||{};
  if(k==="score"){
    const s=v.score, cls=s==null?"":s>=70?"score-hi":s>=40?"score-mid":"score-lo";
    body=`<div class="score ${cls}">${s==null?"—":s}</div>
      <div style="font-size:13px;color:var(--dim);margin:6px 0">${d.factors}:</div>`+
      (v.factors||[]).map(f=>`<div class="factor">−${f.points} · ${esc(f[lang]||f.zh)}</div>`).join("");
  } else if(k==="holders" && v.top){
    body=`<div class="kv"><span>Top10</span><span>${v.top10_pct}%</span></div>
      <div class="kv"><span>≥1% ${lang==="zh"?"鲸鱼":"whales"}</span><span>${v.whales_ge_1pct}</span></div>
      <div class="kv"><span>Gini</span><span>${v.gini}</span></div>
      <table><tr><th>#</th><th>${lang==="zh"?"地址":"Address"}</th><th>${d.pct}</th></tr>`+
      v.top.map((h,i)=>`<tr><td>${i+1}</td><td class="mono">${short(h.address)}</td><td>${h.pct}%</td></tr>`).join("")+`</table>`;
  } else if(k==="sources" && v.traces){
    body = v.traces.map(sr=>`<div class="kv"><span class="mono">${short(sr.holder)}</span>
      <span>${sr.source? (sr.source_is_pool? "← "+d.pool : "← "+short(sr.source)) : "—"}</span></div>`).join("");
    if(v.clusters && v.clusters.length){
      body += `<div style="margin-top:8px;font-size:13px;color:var(--warn)">⚠ ${d.cluster}:</div>`+
        v.clusters.map(c=>`<div class="addr"><span class="mono">${short(c.source)}</span><span>→ ${c.count} ${lang==="zh"?"个大户":"whales"}</span></div>`).join("");
    }
  } else if(k==="creator" && v.creator){
    body = addrRow(v.creator);
  } else if(k==="insider"){
    const sn=(v.snipers||[]), bu=(v.bundles||[]);
    body = `<div class="kv"><span>${lang==="zh"?"疑似狙击手":"Suspected snipers"}</span><span>${sn.length}</span></div>
      <div class="kv"><span>${lang==="zh"?"捆绑/分仓组":"Bundled groups"}</span><span>${bu.length}</span></div>`+
      bu.map(c=>addrRow(c.source)).join("");
  } else if(k==="bigmoves" && v.moves){
    body = v.moves.length? `<table><tr><th>${lang==="zh"?"方向":"Side"}</th><th>${d.pct}</th><th>Tx</th></tr>`+
      v.moves.map(mo=>`<tr><td>${esc(mo.side||mo.side_en||"")}</td><td>${mo.pct}%</td><td class="mono">${short(mo.hash)}</td></tr>`).join("")+`</table>`
      : `<div style="color:var(--dim);font-size:13px">—</div>`;
  } else if(k==="lp" && v.burned_pct!=null){
    body=`<div class="kv"><span>LP ${lang==="zh"?"销毁":"burned"}</span><span>${v.burned_pct}%</span></div>`+addrRow(v.pool||"");
  } else if(k==="supply" && v.total_supply){
    body=`<div class="kv"><span>Total</span><span>${Number(v.total_supply).toLocaleString()}</span></div>`;
  } else if(k==="overview" && v.symbol){
    const f=x=>x==null?"—":x;
    body=`<div class="kv"><span>${v.symbol}</span><span>$${f(v.price_usd)}</span></div>
      <div class="kv"><span>FDV</span><span>$${f(v.fdv)}</span></div>
      <div class="kv"><span>${lang==="zh"?"流动性":"Liquidity"}</span><span>$${f(v.liquidity_usd)}</span></div>
      <div class="kv"><span>24h Vol</span><span>$${f(v.volume_h24)}</span></div>
      <div class="kv"><span>24h ${lang==="zh"?"买/卖":"B/S"}</span><span>${f(v.buys_h24)} / ${f(v.sells_h24)}</span></div>`;
  } else if(k==="wash"){
    body=`<div class="kv"><span>24h ${lang==="zh"?"买":"buys"}</span><span>${v.buys_h24??"—"}</span></div>
      <div class="kv"><span>24h ${lang==="zh"?"卖":"sells"}</span><span>${v.sells_h24??"—"}</span></div>`;
  } else if(k==="creator_deep"){
    const eo = v.is_eoa==null?"—":(v.is_eoa?(lang==="zh"?"普通钱包":"EOA"):(lang==="zh"?"合约":"Contract"));
    body=`<div class="kv"><span>${lang==="zh"?"类型":"Type"}</span><span>${eo}</span></div>
      <div class="kv"><span>${lang==="zh"?"余额":"Balance"}</span><span>${v.native_balance??"—"}</span></div>
      <div class="kv"><span>Tx</span><span>${v.tx_total??"—"}</span></div>
      <div class="kv"><span>${lang==="zh"?"直接创建合约":"Creations"}</span><span>${v.creations_count??"—"}</span></div>`;
    if(v.funder) body+=`<div style="font-size:13px;color:var(--dim);margin-top:6px">${lang==="zh"?"资金来源":"Funder"}:</div>`+addrRow(v.funder);
    if(v.creations&&v.creations.length) body+=`<div style="font-size:13px;color:var(--dim);margin-top:6px">${lang==="zh"?"创建的合约":"Deployed"}:</div>`+
      v.creations.slice(0,5).map(c=>`<div class="addr"><span class="mono">${short(c.contract)}</span></div>`).join("");
  } else if(k==="promo"){
    const L=v.links||{};
    const nm={x_search:"X 搜索",google:"Google",gmgn:"GMGN"};
    body=Object.keys(L).map(k2=>`<a href="${L[k2]}" target="_blank" rel="noopener" style="display:inline-block;background:#2a3550;color:var(--txt);border-radius:8px;padding:10px 16px;margin:4px 6px 4px 0;font-size:14px;text-decoration:none">🔍 ${nm[k2]||k2}</a>`).join("");
  } else if(k==="ai"){
    const st=v.stance_zh||"", cls=st.includes("别碰")?"score-hi":st.includes("观望")?"score-mid":st.includes("无法")?"":"score-lo";
    body=`<div class="score ${cls}" style="font-size:32px">${esc(lang==="zh"?st:(v.stance_en||""))}</div>`;
    const rows=[];
    if(v.price) rows.push([lang==="zh"?"现价":"Price","$"+v.price]);
    if(v.price_24h_ago) rows.push([lang==="zh"?"24h涨幅起点":"24h-ago", "$"+v.price_24h_ago]);
    if(v.max_single_usd) rows.push([lang==="zh"?"单笔上限":"Max single","$"+v.max_single_usd]);
    if(v.stop_ref_pct) rows.push([lang==="zh"?"止损纪律":"Stop", v.stop_ref_pct+"%"]);
    body+=rows.map(r=>`<div class="kv"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
    const rs = lang==="zh"? v.reasons_zh : v.reasons_en;
    if(rs&&rs.length) body+=`<div style="font-size:13px;color:var(--dim);margin:6px 0">${lang==="zh"?"理由":"Reasons"}:</div>`+
      rs.map(x=>`<div class="factor">· ${esc(x)}</div>`).join("");
  }
  return `<div class="card"><h2>${m["title_"+lang]||m.title_zh} ${badge(m.status)}</h2>${body}
    <div class="concl">${esc(conc(m))}</div></div>`;
}
async function scan(){
  const d=t(); const a=$("addr").value.trim(); const out=$("out");
  if(!a){ out.innerHTML=`<div class="err">${d.need}</div>`; return; }
  const ch=$("chain").value;
  out.innerHTML=`<div class="loading">${d.loading}</div>`; $("go").disabled=true;
  try{
    const r=await fetch("/api/analyze?contract="+encodeURIComponent(a)+"&chain="+ch);
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||"unknown");
    const rep=j.report;
    out.innerHTML=`<div class="card"><h2>${esc(rep.market?.symbol||"Token")} <span class="badge ok">${esc(rep.chain)}</span></h2>${addrRow(rep.contract)}</div>`+
      rep.modules.map(renderModule).join("");
  }catch(e){ out.innerHTML=`<div class="err">${d.fail}${esc(e.message)}</div>`; }
  $("go").disabled=false;
}
$("go").onclick=scan;
$("addr").addEventListener("keydown",e=>{ if(e.key==="Enter") scan(); });
$("addr").addEventListener("input",()=>{
  const v=$("addr").value.trim();
  if(/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(v)) $("chain").value="sol";
  else if(/^0x[0-9a-fA-F]{40}$/.test(v) && $("chain").value==="sol") $("chain").value="bsc";
});
applyLang();
</script>
</body>
</html>
